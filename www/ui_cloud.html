<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFactory System</title>
    <link rel="stylesheet" href="/python-webserver/stylesheet.css">
    <link rel="stylesheet" href="/python-webserver/style_cloud.css">
</head>

<body>
    <!-- Header -->
    <div class="topbar">
        <div class="topbar-left">
            <img class="logo" src="/python-webserver/logo.png" alt="Logo">
            <h2>eFactory System</h2>
        </div>
        <div class="nav">
            <a href="/python-webserver?token=$(token)" class="chip">Home</a>
            <a href="/python-webserver/ui_scada.html?token=$(token)" class="chip">SCADA</a>
            <a href="/python-webserver/ui_mes.html?token=$(token)" class="chip">MES</a>
            <a href="/python-webserver/ui_cloud.html?token=$(token)" class="chip">Cloud</a>
            <a href="/python-webserver/ui_admin.html?token=$(token)" class="chip">Admin</a>
        </div>
    </div>

    <!-- Cloud Connection Details -->
    <main class="main-content-area">
        <div class="container">
            <div class="section section-2">
                <div class="input-group">
                    <div id="awsDot" class="status-dot red"></div>
                    <input id="brokerField" type="text" value="-" readonly>
                </div>
                <div class="info-list">
                    <div class="info-item">
                        <span class="info-label">Broker</span>
                        <span id="serviceStatusField" class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Region</span>
                        <span id="regionField" class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Protocol</span>
                        <span id="protocolField" class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">IP Address</span>
                        <span id="ipField" class="info-value">—</span>
                    </div>
                </div>
            </div>

            <div class="section section-4">
                <div class="input-group">
                    <div class="status-dot red"></div>
                    <input type="text" value="127.0.0.1" readonly>
                </div>
                <div class="info-list">
                    <div class="info-item">
                        <span class="info-label">Device name</span>
                        <span class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">System status</span>
                        <span class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Hardware platform</span>
                        <span class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Serial number</span>
                        <span class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Type code</span>
                        <span class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">App</span>
                        <span class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">License(s)</span>
                        <span class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Ports</span>
                        <span class="info-value">—</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const token = "$(token)";

        // ===== FETCH DATA =====
        async function fetchData() {
            try {
                const res = await fetch(`/python-webserver/api/data?token=${token}`);
                return await res.json();
            } catch (err) {
                console.error("Polling error:", err);
                return null;
            }
        }
        async function updateCloud() {
            const data = await fetchData();
            if (!data) return;
            const cloud = data.avg.cloud;

            const connected = cloud.status.connected;
            const connecting = cloud.status.connecting;
            const error = cloud.status.error;

            const broker = cloud.info.broker;
            const region = cloud.info.region;
            const protocol = cloud.info.protocol;
            const ip = cloud.info.ipAddress;
            const lastSync = cloud.info.lastSync;

            // ===== STATUS DOT =====
            const awsDot = document.getElementById("awsDot");
            awsDot.classList.remove("green", "red", "yellow");
            if (connected) {
                awsDot.classList.add("green");
            }
            else if (connecting) {
                awsDot.classList.add("yellow");
            }
            else {
                awsDot.classList.add("red");
            }

            // ===== TEXT STATUS =====
            document.getElementById("serviceStatusField").textContent =
                connected ? "Connected" :
                    connecting ? "Connecting..." :
                        error ? "Error" :
                            "Disconnected";
            // ===== UPDATE INFO =====
            document.getElementById("brokerField").value = broker || "-";
            document.getElementById("regionField").textContent = region || "-";
            document.getElementById("protocolField").textContent = protocol || "-";
            document.getElementById("ipField").textContent = ip || "-";
            document.getElementById("lastSyncField").textContent = lastSync || "-";
        }

        setInterval(updateCloud, 500);
        updateCloud();
    </script>

</body>

</html>
