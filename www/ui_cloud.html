<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFactory System</title>
    <link rel="stylesheet" href="/python-webserver/stylesheet.css">
    <link rel="stylesheet" href="/python-webserver/style_cloud.css">
</head>

<body>
    <!-- Header -->
    <div class="topbar">
        <div class="topbar-left">
            <img class="logo" src="/python-webserver/logo.png" alt="Logo">
            <h2>eFactory System</h2>
        </div>
        <div class="nav">
            <a href="/python-webserver?token=$(token)" class="chip">Home</a>
            <a href="/python-webserver/ui_scada.html?token=$(token)" class="chip">SCADA</a>
            <a href="/python-webserver/ui_mes.html?token=$(token)" class="chip">MES</a>
            <a href="/python-webserver/ui_cloud.html?token=$(token)" class="chip">Cloud</a>
            <a href="/python-webserver/ui_admin.html?token=$(token)" class="chip">Admin</a>
        </div>
    </div>

    <!-- Cloud Connection Details -->
    <main class="main-content-area">
        <div class="container">
            <div class="section section-2">
                <div class="input-group">
                    <div id="awsDot" class="status-dot red"></div>
                    <input id="brokerField" type="text" value="-" readonly>
                </div>
                <div class="info-list">
                    <div class="info-item">
                        <span class="info-label">Broker</span>
                        <span id="serviceStatusField" class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Region</span>
                        <span id="regionField" class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Protocol</span>
                        <span id="protocolField" class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">IP Address</span>
                        <span id="ipField" class="info-value">—</span>
                    </div>
                </div>
            </div>

            <div class="section section-4">
                <div class="input-group">
                    <div id="ctrlxDot" class="status-dot green"></div>
                    <input id="ctrlxIpField" type="text" value="127.0.0.1" readonly>
                </div>

                <div class="info-list">
                    <div class="info-item">
                        <span class="info-label">Device name</span>
                        <span id="ctrlxDeviceName" class="info-value">—</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">System status</span>
                        <span id="ctrlxSystemStatus" class="info-value">—</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Hardware platform</span>
                        <span id="ctrlxArchitecture" class="info-value">—</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Serial number</span>
                        <span id="ctrlxMac" class="info-value">—</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">OS</span>
                        <span id="ctrlxOS" class="info-value">—</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">OS Version</span>
                        <span id="ctrlxOSVersion" class="info-value">—</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">App</span>
                        <span id="ctrlxApp" class="info-value">—</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Ports</span>
                        <span id="ctrlxPorts" class="info-value">8442</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const token = "$(token)";

        // ===== FETCH DATA =====
        async function fetchData() {
            try {
                const res = await fetch(`/python-webserver/api/data?token=${token}`);
                return await res.json();
            } catch (err) {
                console.error("Polling error:", err);
                return null;
            }
        }
        async function updateUI() {
            const data = await fetchData();
            if (!data) return;

            const avg = data.avg;
            const cloud = avg.cloud;
            const info = avg.info;
            const system = avg.system;

            // ================= CLOUD =================
            const awsDot = document.getElementById("awsDot");
            awsDot.classList.remove("green", "red", "yellow");

            if (cloud.status.connected) {
                awsDot.classList.add("green");
            } else if (cloud.status.connecting) {
                awsDot.classList.add("yellow");
            } else {
                awsDot.classList.add("red");
            }

            document.getElementById("serviceStatusField").textContent =
                cloud.status.connected ? "Connected" :
                    cloud.status.connecting ? "Connecting..." :
                        cloud.status.error ? "Error" :
                            "Disconnected";

            document.getElementById("brokerField").value = cloud.info.broker || "-";
            document.getElementById("regionField").textContent = cloud.info.region || "-";
            document.getElementById("protocolField").textContent = cloud.info.protocol || "-";
            document.getElementById("ipField").textContent = cloud.info.ipAddress || "-";

            // ================= CTRLX =================
            const ctrlxDot = document.getElementById("ctrlxDot");
            ctrlxDot.classList.remove("green", "red");

            if (info.ip) {
                ctrlxDot.classList.add("green");
            } else {
                ctrlxDot.classList.add("red");
            }

            document.getElementById("ctrlxIpField").value = info.ip || "-";
            document.getElementById("ctrlxDeviceName").textContent = info.hostname || "-";
            document.getElementById("ctrlxArchitecture").textContent = info.architecture || "-";
            document.getElementById("ctrlxOS").textContent = info.os || "-";
            document.getElementById("ctrlxOSVersion").textContent = info.osVersion || "-";
            document.getElementById("ctrlxMac").textContent = info.macAddress || "-";

            document.getElementById("ctrlxSystemStatus").textContent =
                system.cpuUtilization < 90 ? "Operating" : "Overload";

            document.getElementById("ctrlxApp").textContent = "eFactory System";
        }
        
        setInterval(updateUI, 500);
        updateUI();
    </script>

</body>

</html>
